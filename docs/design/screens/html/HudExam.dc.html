<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Prova simulada em andamento</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./cine.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}
.ptt{all:unset;cursor:pointer;box-sizing:border-box;height:64px;padding:0 32px;border-radius:32px;display:inline-flex;align-items:center;gap:12px;font-family:Manrope,system-ui,sans-serif;font-size:17px;font-weight:700;color:#0b1116;background:#f2a65a}
.ptt:focus-visible{outline:2px solid #ffffff;outline-offset:4px}
.switch{all:unset;cursor:pointer;box-sizing:border-box;height:44px;display:inline-flex;align-items:center;gap:10px;font-family:Manrope,system-ui,sans-serif;font-size:14px;font-weight:600;color:#c9d4db}
.switch:focus-visible{outline:2px solid #ffffff;outline-offset:4px}
</style>
</helmet>
<div class="cine">
<div class="scene" aria-hidden="true"><i class="win" style="left: 30%"></i><i class="pat" style="left: 44%; top: 22%"></i><i class="desk" style="left: 0"></i>
<i style="left: 70%; bottom: 14%; width: 96px; height: 96px; border-radius: 48px; background: #e8e2d4; border: 4px solid #3a4955"></i>
<i style="left: calc(70% + 46px); bottom: calc(14% + 48px); width: 4px; height: 34px; background: #1d2833; border-radius: 2px"></i>
<i style="left: calc(70% + 48px); bottom: calc(14% + 46px); width: 26px; height: 4px; background: #1d2833; border-radius: 2px"></i>
</div>
<div class="scene-tag" style="left: 70%; right: auto; top: auto; bottom: calc(14% + 120px)">[Relógio analógico na mesa]</div>
<div class="scrim-soft" aria-hidden="true" style="background: linear-gradient(0deg, rgba(9,13,17,.85) 0%, rgba(9,13,17,0) 36%)"></div>

<div style="position: absolute; left: 32px; top: 32px; display: flex; align-items: center; gap: 12px" class="panel">
<span style="display: flex; align-items: center; gap: 10px; padding: 12px 18px"><span class="dot" style="background: #f2a65a"></span><span class="h3" style="font-size: 15px">Prova simulada</span><span class="fine">· Voz conectada</span></span>
</div>

<div style="position: absolute; right: 32px; top: 32px; display: flex; gap: 12px">
<button class="btn btn-secondary" style="background: rgba(12,17,22,.84); height: 48px">Cenário e tarefas</button>
<a class="btn btn-secondary" href="Document.dc.html" style="background: rgba(12,17,22,.84); height: 48px">Exames</a>
<a class="btn btn-secondary" href="ResultExam.dc.html" style="background: rgba(12,17,22,.84); height: 48px">Finalizar</a>
</div>

<div style="position: absolute; left: 50%; bottom: 48px; transform: translateX(-50%); width: 820px; display: flex; flex-direction: column; align-items: center; gap: 20px">
<div style="display: flex; align-items: center; gap: 10px" aria-label="Paciente falando">
<span aria-hidden="true" style="display: flex; gap: 4px; align-items: center"><i style="width: 4px; height: 12px; background: #e8eef2; border-radius: 2px"></i><i style="width: 4px; height: 22px; background: #e8eef2; border-radius: 2px"></i><i style="width: 4px; height: 14px; background: #e8eef2; border-radius: 2px"></i><i style="width: 4px; height: 26px; background: #e8eef2; border-radius: 2px"></i><i style="width: 4px; height: 16px; background: #e8eef2; border-radius: 2px"></i></span>
<span class="muted">Paciente falando · só áudio</span>
</div>
<sc-if value="{{ showTranscript }}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; text-align: center; font-size: 22px; font-weight: 600; line-height: 1.4; color: #ffffff">“E essa dor mudou de lugar desde ontem?”</p>
</sc-if>
<div style="display: flex; align-items: center; gap: 28px">
<button class="ptt"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0b1116" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>Segure para falar<span class="kbd" style="color: #0b1116; border-color: #0b1116">Espaço</span></button>
<button class="switch" role="switch" aria-checked="{{ checked }}" onClick="{{ toggle }}">
<span aria-hidden="true" style="{{ track }}"><span style="{{ knob }}"></span></span>Minha transcrição
</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: true };
  }
  renderVals() {
    const on = this.state.on;
    return {
      showTranscript: on,
      checked: on ? 'true' : 'false',
      track: 'display:inline-flex; width:40px; height:24px; border-radius:12px; padding:3px; box-sizing:border-box; background:' + (on ? '#f2a65a' : '#3a4955') + '; justify-content:' + (on ? 'flex-end' : 'flex-start'),
      knob: 'display:block; width:18px; height:18px; border-radius:9px; background:#ffffff',
      toggle: () => this.setState({ on: !on })
    };
  }
}
</script>
</body>
</html>
