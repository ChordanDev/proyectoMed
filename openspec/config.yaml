context: |
  proyectoMed is a planning/specification repository for a Revalida
  clinical-practice MVP (Vite + React + TypeScript SPA + Elixir/Phoenix,
  scaffolded). Source of truth is GitHub Issues on ChordanDev/proyectoMed. The
  runtime scaffold is now in place: `web/` is a Vite + React + TypeScript SPA
  and `backend/` is a JSON-only Phoenix API without Ecto or HTML tooling. The
  scope of this scaffold change is harness-only;
  clinical, product, and `#12` behavior are explicitly out of scope and remain
  unimplemented.
  Agent conventions: see AGENTS.md, docs/agents/issue-tracker.md,
  docs/agents/triage-labels.md, docs/agents/domain.md.
project: proyectomed
strict_tdd: false
testing:
  strict_tdd: false
  rationale: |
    The harness is available (scripts/test.sh, tests/scripts/scaffold_red.sh,
    tests/scripts/test_red.sh), but strict TDD discipline is left to the change
    that implements the first real capability. Toggling strict_tdd is a
    deliberate decision by the capability-implementing change, not by the
    scaffold change. Process-level E2E is available independently of strict
    TDD; coverage remains unavailable.
  capabilities:
    runner:
      available: true
      command: bash scripts/test.sh
      notes: |
        Root orchestrator: runs web unit Vitest
        (npm --prefix web run test:unit),
        backend ExUnit (( cd backend && mix test )), then process-level E2E
        (npm --prefix web run test:e2e). It propagates the exact first non-zero
        exit and skips later phases. PATH-resolved npm/mix let the shell
        acceptance harness substitute fakes.
    unit:
      available: true
      notes: |
        Web SPA: Vitest + @testing-library/react (web/src/**/*.test.ts(x)).
        Backend: ExUnit (backend/test/).
    integration:
      available: true
      notes: |
        Backend ConnCase drives the Plug pipeline. Web integration tests cover
        the Station flow through the API client and process-level E2E harness.
    e2e:
      available: true
      command: npm --prefix web run test:e2e
      notes: |
        Vitest runs the happy-path, technical-failure, and session-expiry
        scenarios in web/src/integration/stationFlow.test.ts. The harness starts
        a real Phoenix process over HTTP with a deterministic local provider
        mock. This is process/API E2E, not browser automation.
    coverage:
      available: false
      rationale: |
        No coverage tool is installed in the baseline scaffold. Web SPA and
        backend each ship baseline tests; coverage tooling is a downstream
        decision tied to a future capability-implementing change.
    linter:
      available: true
      notes: |
        Backend: mix format (declared in backend/.formatter.exs; alias
        precommit runs format --check-formatted). Web SPA: TypeScript strict
        mode via tsc --noEmit.
    type_checker:
      available: true
      notes: |
        Web SPA: typescript ~5.6.3 + tsconfig.json (strict: true, bundler
        moduleResolution, vite/client + vitest/globals types). Backend:
        dialyzer is not enabled in the baseline; Phoenix's compile
        --warnings-as-errors runs via the precommit alias.
    formatter:
      available: true
      notes: |
        Backend: mix format (formatter declared by phx_new generator).
        Web SPA: TypeScript/Vite project default settings.
  harnesses:
    scaffold_script: scripts/scaffold.sh
    test_script: scripts/test.sh
    scaffold_red: tests/scripts/scaffold_red.sh
    test_red: tests/scripts/test_red.sh
    e2e_process: web/src/integration/harness.ts
    e2e_scenarios: web/src/integration/stationFlow.test.ts
    notes: |
      The shell acceptance harnesses are hermetic (bash fake-command stubs over
      PATH). The E2E harness starts a real Phoenix process and a deterministic
      local provider mock; it requires no external network access.
phases:
  proposal:
    required: true
    input: GitHub issue reference (number + URL) for the change.
    output: openspec/changes/<change-id>/proposal.md
  spec:
    required: true
    format: delta
    output: openspec/changes/<change-id>/specs/<capability>/spec.md
  design:
    required: true
    output: openspec/changes/<change-id>/design.md
  tasks:
    required: true
    format: numbered
    output: openspec/changes/<change-id>/tasks.md
  apply:
    strategy: auto-chain
    review_budget_lines: 800
    test_command: bash scripts/test.sh
    notes: |
      Apply batches MUST run `bash scripts/test.sh` after their work unit
      to prove the existing harness still passes. New work units may add
      suites but MUST NOT regress web Vitest, process-level E2E, or backend
      ExUnit.
  verify:
    required_for: [archive]
    test_command: bash scripts/test.sh
    gates:
      - proposal_completed
      - specs_completed
      - design_completed
      - tasks_completed
      - apply_receipts_attached
      - scripts/test.sh exits 0
  archive:
    on_success: openspec/specs/<capability>/spec.md synced from change delta.
    on_failure: leave change in openspec/changes/<change-id>/ with failure note.
links:
  tracker: https://github.com/ChordanDev/proyectoMed/issues
  parent_issue_for_example: "10"  # parent of issue #12 (evidence lineage)
